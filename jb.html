<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MANSOOR0X // NVS</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

      :root {
        --color-bg: #05070a;
        --color-initial: #52688f;
        --color-ok: #00ff88;
        --color-fail: #ff3333;
        --color-text: #e0e6ed;
        --glass: blur(20px) saturate(180%);
        --ease: cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: var(--color-bg);
        font-family: 'Inter', sans-serif;
        color: var(--color-text);
        overflow: hidden;
        perspective: 1000px;
      }

      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: 
          radial-gradient(at 10% 20%, rgba(30, 58, 138, 0.15) 0px, transparent 50%),
          radial-gradient(at 90% 80%, rgba(8, 145, 178, 0.15) 0px, transparent 50%);
        opacity: 0.8;
        z-index: -1;
      }

      #main-container {
        position: relative;
        width: 90%;
        max-width: 400px;
        aspect-ratio: 1/1;
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: var(--glass);
        -webkit-backdrop-filter: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: all 0.6s var(--ease);
        box-shadow: 0 30px 60px rgba(0,0,0,0.4), 
                    inset 0 0 0 1px rgba(255,255,255,0.05);
      }

      body.done #main-container {
        box-shadow: 0 30px 80px rgba(0, 255, 136, 0.15), 
                    inset 0 0 0 1px rgba(0, 255, 136, 0.3);
        border-color: rgba(0, 255, 136, 0.3);
      }

      body.fail #main-container {
        box-shadow: 0 30px 80px rgba(255, 51, 51, 0.15), 
                    inset 0 0 0 1px rgba(255, 51, 51, 0.3);
        border-color: rgba(255, 51, 51, 0.3);
      }

      #brand {
        font-weight: 900;
        font-size: 24px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        margin-bottom: 28px;
        background: linear-gradient(to bottom right, #ffffff, #8b9bb4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: all 0.5s var(--ease);
      }

      body.done #brand {
        filter: drop-shadow(0 0 15px var(--color-ok));
        background: var(--color-ok);
        -webkit-background-clip: text;
      }

      body.fail #brand {
        filter: drop-shadow(0 0 15px var(--color-fail));
        background: var(--color-fail);
        -webkit-background-clip: text;
      }

      /* Cat display: loading -> cat 1, done -> cat 2, fail -> cat 3 */
      #visual-indicator {
        position: relative;
        width: 190px;
        height: 190px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #cat-frame {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 32px;
        overflow: hidden;
        border: 3px solid var(--color-initial);
        box-shadow: 0 0 20px rgba(82, 104, 143, 0.5);
        transition: border-color 0.5s var(--ease), box-shadow 0.5s var(--ease);
      }

      .cat {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.4s var(--ease);
        pointer-events: none;
        -webkit-user-drag: none;
      }

      #cat-loading { opacity: 1; }
      body.done #cat-loading, body.fail #cat-loading { opacity: 0; }
      body.done #cat-ok { opacity: 1; }
      body.fail #cat-fail { opacity: 1; }

      body.done #cat-frame { border-color: var(--color-ok); box-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
      body.fail #cat-frame { border-color: var(--color-fail); box-shadow: 0 0 30px rgba(255, 51, 51, 0.5); }

      #spin {
        position: absolute;
        width: 118%;
        height: 118%;
        border: 3px solid transparent;
        border-top-color: var(--color-text);
        border-radius: 50%;
        animation: real-spin 0.8s linear infinite;
        opacity: 0.3;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      body.done #spin, body.fail #spin { opacity: 0; }

      #msg {
        margin-top: 22px;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: var(--color-fail);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: none;
      }
      body.fail #msg { display: block; }

      #wrap { padding: 0; }
      #state, #out { display: none; }
      body.log body::before,
      body.log #main-container,
      body.log #footer {
        display: none;
      }
      body.log {
        overflow: auto;
        display: block;
        padding: 20px;
        background: var(--color-bg);
      }
      body.log #wrap {
        display: block;
        max-width: 900px;
        margin: 0 auto;
      }
      body.log #state {
        display: block;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--color-text);
        font-family: 'JetBrains Mono', monospace;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.6 'JetBrains Mono', monospace;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 16px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        color: var(--color-text);
      }

      .ok { color: var(--color-ok); }
      .bad { color: var(--color-fail); }
      .warn { color: #e3b341; }
      .safe { color: var(--color-ok); }
      .danger { color: var(--color-fail); }
      code { color: #8b9bb4; font-family: 'JetBrains Mono', monospace; }

      @keyframes real-spin {
        to { transform: rotate(360deg); }
      }

      #footer {
        position: fixed;
        bottom: 20px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.2);
        letter-spacing: 0.2em;
      }
    </style>
  </head>
